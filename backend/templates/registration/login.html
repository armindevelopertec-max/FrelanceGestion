<!DOCTYPE html>
<html lang="es" class="h-full bg-gray-50">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión | FreelanceFlow</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>body { font-family: 'Inter', sans-serif; }</style>
</head>
<body class="h-full flex items-center justify-center p-6">
    <div class="w-full max-w-md">
        <div class="text-center mb-10">
            <span class="text-3xl font-extrabold text-indigo-900 tracking-tight">Freelance<span class="text-indigo-400">Flow</span></span>
            <p class="text-gray-500 mt-2 font-medium">Panel de Gestión para Freelancers</p>
        </div>

        <div class="bg-white p-10 rounded-3xl shadow-xl border border-gray-100">
            <h1 class="text-2xl font-bold text-gray-900 mb-8 text-center">Bienvenido de nuevo</h1>
            
            {% if form.errors %}
                <div class="mb-6 p-4 bg-red-50 border border-red-100 text-red-700 text-sm rounded-xl font-medium">
                    Usuario o contraseña incorrectos. Por favor, inténtalo de nuevo.
                </div>
            {% endif %}

            <form method="POST">
                {% csrf_token %}
                <div class="space-y-5">
                    <div>
                        <label for="id_username" class="block text-sm font-semibold text-gray-700 mb-1">Usuario</label>
                        <input type="text" name="username" id="id_username" required autofocus
                               class="w-full px-4 py-3 rounded-xl border border-gray-200 focus:ring-2 focus:ring-indigo-500 outline-none transition bg-gray-50 focus:bg-white">
                    </div>
                    <div>
                        <label for="id_password" class="block text-sm font-semibold text-gray-700 mb-1">Contraseña</label>
                        <input type="password" name="password" id="id_password" required
                               class="w-full px-4 py-3 rounded-xl border border-gray-200 focus:ring-2 focus:ring-indigo-500 outline-none transition bg-gray-50 focus:bg-white">
                    </div>
                </div>

                <div class="mt-8">
                    <button type="submit" class="w-full bg-indigo-600 text-white font-bold py-4 rounded-2xl hover:bg-indigo-700 shadow-lg shadow-indigo-200 transition-all active:scale-[0.98]">
                        Entrar al Dashboard
                    </button>
                </div>
            </form>
        </div>
        
        <p class="text-center text-gray-400 text-xs mt-8">
            &copy; 2026 FreelanceFlow MVP. Todos los derechos reservados.
        </p>
    </div>
</body>
</html>
