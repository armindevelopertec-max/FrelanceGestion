{% extends 'layout/base.html' %}

{% block content %}
<div class="max-w-2xl mx-auto">
    <div class="mb-8">
        <a href="/facturas/" class="text-amber-600 hover:text-amber-800 flex items-center text-sm font-semibold mb-4">
            <svg class="w-4 h-4 mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M15 19l-7-7 7-7"></path></svg>
            Volver a la lista
        </a>
        <h1 class="text-3xl font-bold text-gray-900">Editar Factura</h1>
        <p class="text-gray-500 mt-1">Modificar detalles de la factura {{ invoice.invoice_number }}.</p>
    </div>

    <div class="bg-white p-10 rounded-2xl shadow-sm border border-gray-100">
        <form action="/facturas/{{ invoice.id }}/actualizar/" method="POST">
            {% csrf_token %}
            <div class="space-y-6">
                <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-2">Proyecto Vinculado</label>
                    <select name="project_id" required class="w-full px-4 py-3 rounded-xl border border-gray-200 focus:ring-2 focus:ring-amber-500 outline-none transition bg-white text-gray-700">
                        {% for project in projects %}
                            <option value="{{ project.id }}" {% if project.id == invoice.project.id %}selected{% endif %}>{{ project.name }} ({{ project.client.name }})</option>
                        {% endfor %}
                    </select>
                </div>
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm font-semibold text-gray-700 mb-2">Moneda</label>
                        <select name="currency" required class="w-full px-4 py-3 rounded-xl border border-gray-200 focus:ring-2 focus:ring-amber-500 outline-none transition bg-white text-gray-700">
                            <option value="USD" {% if invoice.currency == 'USD' %}selected{% endif %}>Dólares (USD)</option>
                            <option value="BOB" {% if invoice.currency == 'BOB' %}selected{% endif %}>Bolivianos (Bs)</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-sm font-semibold text-gray-700 mb-2">Número de Factura</label>
                        <input type="text" name="invoice_number" value="{{ invoice.invoice_number }}" required 
                               class="w-full px-4 py-3 rounded-xl border border-gray-200 focus:ring-2 focus:ring-amber-500 outline-none transition">
                    </div>
                </div>
                <div class="grid grid-cols-1">
                    <div>
                        <label class="block text-sm font-semibold text-gray-700 mb-2">Monto</label>
                        <input type="number" name="amount" value="{{ invoice.amount|stringformat:'.2f' }}" step="0.01" required 
                               class="w-full px-4 py-3 rounded-xl border border-gray-200 focus:ring-2 focus:ring-amber-500 outline-none transition">
                    </div>
                </div>
                <div class="grid grid-cols-1">
                    <div>
                        <label class="block text-sm font-semibold text-gray-700 mb-2">Fecha de Vencimiento</label>
                        <input type="date" name="due_date" value="{{ invoice.due_date|date:'Y-m-d' }}" required 
                               class="w-full px-4 py-3 rounded-xl border border-gray-200 focus:ring-2 focus:ring-amber-500 outline-none transition">
                    </div>
                </div>
                <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-2">Estado del Cobro</label>
                    <select name="status" class="w-full px-4 py-3 rounded-xl border border-gray-200 focus:ring-2 focus:ring-amber-500 outline-none transition bg-white text-gray-700">
                        <option value="pending" {% if invoice.status == 'pending' %}selected{% endif %}>Pendiente</option>
                        <option value="paid" {% if invoice.status == 'paid' %}selected{% endif %}>Pagada</option>
                        <option value="cancelled" {% if invoice.status == 'cancelled' %}selected{% endif %}>Cancelada</option>
                    </select>
                </div>
            </div>
            
            <div class="mt-10 flex space-x-4">
                <a href="/facturas/" class="flex-1 px-6 py-3 rounded-xl bg-gray-50 text-gray-700 font-bold hover:bg-gray-100 transition text-center">
                    Cancelar
                </a>
                <button type="submit" class="flex-1 px-6 py-3 rounded-xl bg-amber-600 text-white font-bold hover:bg-amber-700 shadow-lg shadow-amber-200 transition">
                    Guardar Cambios
                </button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
