services:
  db:
    image: postgres:15-alpine
    volumes:
      - postgres_data:/var/lib/postgresql/data/
    environment:
      - POSTGRES_DB=freelance_db
      - POSTGRES_USER=admin
      - POSTGRES_PASSWORD=adminpass
    ports:
      - "5432:5432"

  web:
    build: ./backend
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - ./backend:/app:Z
    environment:
      - DEBUG=1
      - DB_NAME=freelance_db
      - DB_USER=admin
      - DB_PASSWORD=adminpass
      - DB_HOST=db
      - DB_PORT=5432
      - SECRET_KEY=django-insecure-mvp-key-change-this-in-production
    ports:
      - "8000:8000"
    depends_on:
      - db

volumes:
  postgres_data:
